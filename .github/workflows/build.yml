name: Build APK from ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip project
      run: |
        unzip DeepSound-DSP-Android-ready.zip -d ./project
        ls -la ./project

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: ./project
      run: npm install --legacy-peer-deps

    - name: Build web app
      working-directory: ./project
      run: npm run build

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Add Capacitor Android
      working-directory: ./project
      run: |
        npm install @capacitor/android@7 --legacy-peer-deps
        export TS_NODE_COMPILER_OPTIONS='{"module":"commonjs"}'
        npx cap add android

    - name: Sync Capacitor
      working-directory: ./project
      run: npx cap sync android

    - name: Build APK
      working-directory: ./project/android
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: ./project/android/app/build/outputs/apk/debug/app-debug.apk
